<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h2{
            color: blue;
        }
    </style>

</head>
<body>
    <form action="">
    <h1>payment form</h1>
    <h1>* symbol is compulsary write </h1>
    <h2>contant information</h2>
    <p>name: <input type="text" name="name" required></p>
   <fieldset>
    <legend>gender</legend>
    <p>
        
        male <input type="radio" name="gender" id="male"> female <input type="radio" name="gender" id="female"> 
    </p>
    </fieldset>
    <p> Address: <textarea name="address" id="address" cols="150" rows="9"></textarea></p>
    <p> Email: <input type="email" name="email" id="email"></p>
    <p> Pincode: <input type="number" name="Pincode" id="pincode"></p>
    <h2>Paymenr information</h2>
    <p>card Type:
        <select name="card_type" id="card_type">
            <option value="">--select a card type</option>
            <option value="visa">visa</option>
            <option value="rupay">rupay</option>
            <option value="mastercard">mastercard</option>
            </select>

    </p>
    <p>
        card number <input type="number" name="card_number" id="card_number">

    </p>
    <p>
        Expiration Date <input type="date" name="Expiration_date" id="Expiration_date">

    </p>
    <p>CVV <input type="password" name="cvv" id="cvv"></p>
    <input type="submit" value="Pay Now">

    </form>
    
</body>
</html>
